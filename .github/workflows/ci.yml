name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saga_orchestrator
          POSTGRES_USER: saga
          POSTGRES_PASSWORD: saga
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Unit + integration tests (testcontainers spins up its own Postgres/RabbitMQ)
        run: go test -tags=integration ./... -coverprofile=coverage.out -coverpkg=./...
      - run: go tool cover -func=coverage.out | tail -1

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, worker, outbox-dispatcher]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: TARGET=${{ matrix.target }}
          push: false
          tags: pos-saga-orchestrator:${{ matrix.target }}
